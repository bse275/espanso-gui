name: Release

# Builds Windows, macOS, and Linux packages natively on their own runners
# (electron-builder can't cross-compile a .dmg or reliably cross-compile
# Linux targets from Windows) and attaches them to a GitHub Release.
#
# Trigger a release by pushing a tag: `git tag v1.2.0 && git push origin v1.2.0`
# Or run it manually via the Actions tab (workflow_dispatch) to build
# without publishing a release - artifacts are still uploaded to the run.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: espanso-gui-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore

      - name: Release title
        id: title
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          HEADLINE=$(node -p "require('./package.json').releaseHeadline || ''")
          if [ -n "$HEADLINE" ]; then
            echo "name=Release v${VERSION} - ${HEADLINE}" >> "$GITHUB_OUTPUT"
          else
            echo "name=Release v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.title.outputs.name }}
          body: |
            ## Deutsche Fassung

            Fork von [djekanovic/espanso-gui](https://github.com/djekanovic/espanso-gui)
            mit vollständig ins Deutsche übersetzter Oberfläche. Espanso-Fachbegriffe
            (Snippet, Trigger, Match, Backend) bleiben unverändert.

            > Die Builds sind nicht signiert — Windows SmartScreen und macOS Gatekeeper
            > warnen beim ersten Start.
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
